daemon off;
pid /tmp/nginx.pid;
error_log /tmp/nginx-error.log warn;
worker_processes 1;
user nobody nogroup;
events { worker_connections 512; }
http {
map $http_upgrade $connection_upgrade { default upgrade; "" close; }
  access_log /tmp/nginx-access.log;
  client_body_temp_path /tmp/nc1;
  proxy_temp_path /tmp/nc2;
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  # allow large agent uploads/playlists
  client_max_body_size 512m;
  server {
    listen 8081;
    # auto-pair one-liner into index.html (CSP allows inline script)
    sub_filter '</title>' '</title><script>(function(){var c=null;try{var h=location.hash;if(h&&h.indexOf("#code=")===0){c=decodeURIComponent(h.slice(6));}}catch(e){}
if(c){localStorage.removeItem("zeroclaw_token");history.replaceState(null,"",location.pathname+location.search);fetch("/api/pair",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code:c,device_name:"Dawnistic Cloud",device_type:"browser"})}).then(function(r){return r.json()}).then(function(d){var t=d&&(d.token||d.access_token||d.bearer);if(t){try{localStorage.setItem("zeroclaw_token",t);}catch(e){}location.reload();}}).catch(function(){});}})();</script></title>';
    sub_filter_once on;
    sub_filter_types text/html;
    location / {
      proxy_pass http://127.0.0.1:42617;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      # websocket live chats via AgentChat
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      # streaming responses
      proxy_buffering off;
    }
  }
}
